[project]
name = "stark"
version = "0.2.0"
description = "Self-Training Adaptive Reasoning Kernel"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "accelerate>=0.24.0",
    "peft>=0.7.0",
    "bitsandbytes>=0.41.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "sentence-transformers>=2.2.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "chromadb>=0.4.0",
    "mcp>=1.12.0",
    "asyncio-mqtt>=0.16.0",
    "networkx>=3.0",
    "google-genai>=1.0.0",
    "apscheduler>=3.10",
    "notion-client>=2.2",
    "google-api-python-client>=2.100",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pygments>=2.18.0", # pytest terminal highlighting (explicit pin; transitive via pytest)
    "ruff>=0.16.0",
    "mypy>=1.17.0",
    "bandit>=1.9.0",
    "pre-commit>=4.0.0",
    "vulture>=2.0",
]
voice = [
    "faster-whisper>=1.0.0",
    "openwakeword>=0.5.0",
    "piper-tts>=1.2.0",
    "pyttsx3>=2.90",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "plyer>=2.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM", "TCH"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.vulture]
paths = ["core", "memory", "agents", "learning", "capabilities", "voice", "automation", "rag", "mcp", "utils"]
min_confidence = 80
